name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  # 'ci' below is the branch rule's required status check, so this workflow has
  # to start on every PR: one held back by a paths filter reports nothing at all
  # and leaves that check pending forever. Doc-only changes are skipped a job at
  # a time instead, which the rule accepts as a pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes outside docs
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # No diff to read — a fresh branch, a force push, a manual run — means
          # the full suite runs.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rest=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -Ev '^docs/|^LICENSE$|^LICENSES/|\.md$' || true)
          if [ -n "$rest" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Skia system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglvnd0

      # --extra dev pulls in 'mcp': without it the MCP server tests skip
      # silently. Redundant with the dev group, kept as the explicit record.
      - name: Sync locked dependencies
        run: uv sync --locked --dev --extra dev

      - name: Run mypy
        run: uv run mypy

      - name: Run flake8
        run: uv run flake8 src tests samples --max-line-length=120 --extend-ignore=E203

      - name: Run pytest
        run: uv run pytest

  # The plugin's async runner defers to pytest-asyncio, which the job above
  # always installs. Re-run the suite without it so the runner is exercised.
  check-without-pytest-asyncio:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Skia system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglvnd0

      - name: Sync locked dependencies
        run: uv sync --locked --dev --extra dev

      - name: Uninstall pytest-asyncio
        run: uv pip uninstall pytest-asyncio

      - name: Run pytest
        run: uv run --no-sync pytest

  # The single required status check. It stands in for the jobs above so the
  # branch rule never has to name a matrix entry.
  ci:
    needs: [changes, check, check-without-pytest-asyncio]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the aggregate result
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.check.result }}
            ${{ needs['check-without-pytest-asyncio'].result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job this check stands in for did not pass."; exit 1 ;;
            esac
          done
