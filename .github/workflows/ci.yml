name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - '**/*.md'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Skia system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglvnd0

      # --extra dev pulls in 'mcp': without it the MCP server tests skip
      # silently. Redundant with the dev group, kept as the explicit record.
      - name: Sync locked dependencies
        run: uv sync --locked --dev --extra dev

      - name: Run mypy
        run: uv run mypy

      - name: Run flake8
        run: uv run flake8 src tests samples --max-line-length=120 --extend-ignore=E203

      - name: Run pytest
        run: uv run pytest

  # The plugin's async runner defers to pytest-asyncio, which the job above
  # always installs. Re-run the suite without it so the runner is exercised.
  check-without-pytest-asyncio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Skia system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglvnd0

      - name: Sync locked dependencies
        run: uv sync --locked --dev --extra dev

      - name: Uninstall pytest-asyncio
        run: uv pip uninstall pytest-asyncio

      - name: Run pytest
        run: uv run --no-sync pytest
