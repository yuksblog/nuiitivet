[project]
authors = [
  {name = "yuksblog", email = "kotatu.kotatu@gmail.com"},
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "materialyoucolor>=3.0.3",
  "pyglet>=2.1.14",
  "pyopengl>=3.1.10",
  "skia-python>=138.0",
]
description = "Intuitive UI framework for Python"
keywords = ["ui", "desktop", "framework", "graphics", "opengl", "skia", "material design"]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
name = "nuiitivet"
readme = "README.md"
requires-python = ">=3.10"
version = "0.16.0"

[project.urls]
Changelog = "https://github.com/yuksblog/nuiitivet/releases"
Documentation = "https://yuksblog.github.io/nuiitivet/"
Homepage = "https://github.com/yuksblog/nuiitivet"
Issues = "https://github.com/yuksblog/nuiitivet/issues"
Repository = "https://github.com/yuksblog/nuiitivet"

[project.entry-points."pyinstaller40"]
hook-dirs = "nuiitivet._pyinstaller:get_hook_dirs"

[project.optional-dependencies]
mcp = [
  "mcp>=1.2.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "flake8>=7.0.0",
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "types-pyinstaller>=5.1",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mike>=2.0.0",
]

[tool.mypy]
check_untyped_defs = true
files = ["src", "tests", "samples"]
mypy_path = "stubs"

# Tests rely on monkeypatching and hand-written stub classes, which do not
# survive body checking. Keep their bodies unchecked and drop the resulting
# "untyped body" notes.
[[tool.mypy.overrides]]
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]
module = ["tests.*"]

# 'mcp' is an optional dependency (the [mcp] extra); CI type-checks without it
# installed. Treat its imports as resolvable so the optional dev/mcp_server.py
# module still type-checks. When the SDK *is* installed (a contributor working
# on the MCP server), mypy uses its real types -- this override only suppresses
# the "missing stub" error when it is absent.
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["mcp.*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nuiitivet" = ["material/symbols/*"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]
