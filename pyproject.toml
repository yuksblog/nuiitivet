[project]
authors = [
  {name = "yuksblog", email = "kotatu.kotatu@gmail.com"},
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "materialyoucolor>=3.0.3",
  "pyglet>=2.1.14,<3",
  "pyopengl>=3.1.10",
  "skia-python>=138.0",
  'jeepney>=0.9.0; sys_platform == "linux"',
]
description = "AI friendly Desktop UI framework for Python"
keywords = ["ui", "desktop", "framework", "graphics", "opengl", "skia", "material design"]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
name = "nuiitivet"
readme = "README.md"
requires-python = ">=3.11"
version = "0.25.0"

[project.urls]
Changelog = "https://github.com/yuksblog/nuiitivet/releases"
Documentation = "https://yuksblog.github.io/nuiitivet/"
Homepage = "https://github.com/yuksblog/nuiitivet"
Issues = "https://github.com/yuksblog/nuiitivet/issues"
Repository = "https://github.com/yuksblog/nuiitivet"

[project.entry-points."pyinstaller40"]
hook-dirs = "nuiitivet._pyinstaller:get_hook_dirs"

[project.entry-points.pytest11]
nuiitivet = "nuiitivet.testing.plugin"

[project.optional-dependencies]
dev = [
  "mcp>=1.2.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  # Self-reference the published extra so a plain `uv sync` keeps 'mcp'
  # installed: extras are not synced by default, and the sync is exact.
  "nuiitivet[dev]",
  "flake8>=7.0.0",
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "types-pyinstaller>=5.1",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mike>=2.0.0",
]

[tool.mypy]
check_untyped_defs = true
files = ["src", "tests", "samples"]
mypy_path = "stubs"

[[tool.mypy.overrides]]
check_untyped_defs = false
disable_error_code = ["annotation-unchecked"]
module = ["tests.*"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["mcp.*"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["jeepney.*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nuiitivet" = ["material/symbols/*"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]
